server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # A bare `proxy_pass http://gateway:3000/...;` resolves "gateway" ONCE, at
  # nginx startup — if that lookup fails (container starts before the
  # gateway's DNS record exists, or this image runs standalone outside
  # Compose/K8s entirely) nginx refuses to start at all. RESOLVER_IP is
  # substituted at container start (see Dockerfile CMD) with whatever's
  # actually in /etc/resolv.conf — Docker's embedded DNS or the cluster's
  # CoreDNS, whichever this container happens to be running under — and
  # putting the upstream in a variable forces nginx to re-resolve it lazily,
  # per request, through that resolver instead of once at config load.
  resolver RESOLVER_IP valid=10s;

  # The dashboard is built with VITE_API_URL=/api (see Dockerfile), so every
  # API call it makes is same-origin and lands here — nginx forwards it to
  # the gateway container/service by name. This is what lets the same built
  # image work unmodified in Docker Compose and in Kubernetes: only this
  # proxy target differs between environments, never the browser-facing URL.
  location /api/ {
    # Once proxy_pass's target contains a variable, nginx can no longer do
    # its usual "replace the part of the URI that matched this location"
    # rewrite — it has no way to know at config-load time where the URI part
    # even starts. Left at just `$gateway_upstream/api/`, EVERY request here
    # was forwarded to the literal path "/api/", dropping whatever came after
    # (e.g. "/api/notifications" → gateway saw "/api/"). $request_uri is the
    # client's original path+query, untouched by this location's matching,
    # so appending it explicitly passes the whole thing through as-is —
    # which is exactly right here since the public and internal paths are
    # identical ("/api/..." on both sides), nothing needs rewriting.
    set $gateway_upstream http://gateway:3000;
    proxy_pass $gateway_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA fallback: any path that isn't a real static file (i.e. every
  # client-side route like /send or /notifications) serves index.html so
  # React Router can take over and render it, instead of nginx 404ing.
  location / {
    try_files $uri /index.html;
  }
}

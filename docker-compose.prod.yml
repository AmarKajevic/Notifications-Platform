# Full containerized stack: infra + all 4 app services, each built from its
# own Dockerfile (see gateway/Dockerfile, email-worker/Dockerfile, etc).
#
# Run with:
#   docker compose -f docker-compose.prod.yml up --build
#
# DATABASE_URL is read from the repo's .env file (Compose loads .env
# automatically) since it's a real, reachable Postgres (Supabase) either way.
# KAFKA_BROKERS / REDIS_URL / SMTP_HOST are NOT read from .env — those point
# at "localhost" there, which is only correct for services running on your
# host machine (`pnpm nx serve ...`). Inside this network, containers reach
# each other by service name, so those are hardcoded below instead.
#
# Don't run this alongside the dev docker-compose.yml — both use the same
# container names and ports.

services:
  kafka-data-init:
    image: busybox
    command: ['sh', '-c', 'chown -R 1000:1000 /data']
    volumes:
      - kafka-data:/data

  kafka:
    image: apache/kafka:4.3.1
    container_name: notification-kafka
    depends_on:
      kafka-data-init:
        condition: service_completed_successfully
    ports:
      - '9092:9092'
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    # The image's default advertised.listeners is PLAINTEXT://localhost:9092,
    # i.e. every client is told to reconnect to "localhost" — which from inside
    # another container is that container itself, so the connection is refused
    # even though the initial bootstrap to kafka:9092 succeeded. Two listeners
    # fix that: INTERNAL (kafka:19092) for containers on this network and
    # EXTERNAL (localhost:9092, published to the host) for `pnpm nx serve`.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list',
        ]
      interval: 5s
      timeout: 5s
      retries: 15

  # Creates the topic up front. Otherwise it only comes into existence on the
  # first metadata request, which fails with UNKNOWN_TOPIC_OR_PARTITION — and a
  # Kafka consumer that starts first crashes on that uncaught error.
  kafka-topics-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic notification.requested
        --partitions 1 --replication-factor 1

  mailpit:
    image: axllent/mailpit:latest
    container_name: notification-mailpit
    ports:
      - '1025:1025'
      - '8025:8025'

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: notification-gateway
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKERS: kafka:19092
      REDIS_URL: redis://redis:6379
      PORT: '3000'
    restart: on-failure
    # /api/ready = can this instance take a POST (Postgres + Redis reachable).
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:3000/api/ready']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  email-worker:
    build:
      context: .
      dockerfile: email-worker/Dockerfile
    container_name: notification-email-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKERS: kafka:19092
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_FROM: notifications@local.test
      HEALTH_PORT: '3001'
    restart: on-failure
    # /ready = Kafka consumer joined its group and Postgres answers.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:3001/ready']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully

  webhook-worker:
    build:
      context: .
      dockerfile: webhook-worker/Dockerfile
    container_name: notification-webhook-worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      KAFKA_BROKERS: kafka:19092
      HEALTH_PORT: '3002'
    restart: on-failure
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:3002/ready']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully

  retry-scheduler:
    build:
      context: .
      dockerfile: retry-scheduler/Dockerfile
    container_name: notification-retry-scheduler
    restart: on-failure
    # /health = the cron is still ticking; /ready = Postgres answers.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO /dev/null http://127.0.0.1:3003/health && wget -qO /dev/null http://127.0.0.1:3003/ready',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HEALTH_PORT: '3003'

volumes:
  kafka-data:

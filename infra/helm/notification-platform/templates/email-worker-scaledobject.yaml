apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: email-worker
  labels:
    {{- include "notification-platform.labels" . | nindent 4 }}

spec:
  scaleTargetRef:
    name: email-worker

  pollingInterval: 10

  cooldownPeriod: 60

  minReplicaCount: 1

  maxReplicaCount: 6

  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.config.kedaKafkaBrokers | quote }}
        # NestJS's ServerKafka transport appends "-server" to the configured
        # groupId automatically (see node_modules/@nestjs/microservices/server/
        # server-kafka.js, `postfixId` default) — the real consumer group is
        # NOT "email-worker-group" from main.ts, it's this. Confirmed live via
        # `kafka-consumer-groups.sh --list`.
        consumerGroup: email-worker-group-server
        topic: notification.requested
        lagThreshold: "10"
        activationLagThreshold: "1"
        offsetResetPolicy: latest
        allowIdleConsumers: "false"
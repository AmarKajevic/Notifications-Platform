apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    {{- include "notification-platform.labels" . | nindent 4 }}
spec:
  serviceName: kafka-headless
  replicas: {{ .Values.kafka.replicas }}

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka
        {{- include "notification-platform.selectorLabels" . | nindent 8 }}

    spec:
      # The image runs as uid/gid 1000 (appuser). PVCs are mounted root-owned
      # by default, so without fsGroup the first write to kafka-data fails
      # with AccessDeniedException.
      securityContext:
        fsGroup: 1000

      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}

          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093

          env:
            - name: KAFKA_NODE_ID
              value: "1"

            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"

            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka-headless:9093"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

            # Only matters if a client connects before the topics-init Job
            # runs and triggers auto-create — keeps that race from silently
            # creating the topic with Kafka's own default of 1 partition.
            - name: KAFKA_NUM_PARTITIONS
              value: {{ .Values.kafka.topic.partitions | quote }}

            # The image's default log.dirs is /tmp/kraft-combined-logs, which
            # is NOT where kafka-data is mounted below. Without this, every
            # pod restart silently loses all data even though the PVC exists.
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}

          startupProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 9092
            periodSeconds: 20

  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.kafka.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage.size }}

# Creates the topic up front. Otherwise it only comes into existence on the
# first metadata request, which fails with UNKNOWN_TOPIC_OR_PARTITION — and a
# worker whose consumer starts before that crashes on the uncaught error.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  labels:
    {{- include "notification-platform.labels" . | nindent 4 }}
  annotations:
    # Re-run this Job on every `helm upgrade`, not just the first install —
    # Jobs are immutable, so without a fresh name Helm can't just patch it.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kafka-topics-init
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          command:
            - /opt/kafka/bin/kafka-topics.sh
            - --bootstrap-server
            - "kafka:{{ .Values.kafka.service.clientPort }}"
            - --create
            - --if-not-exists
            - --topic
            - {{ .Values.kafka.topic.name | quote }}
            - --partitions
            - {{ .Values.kafka.topic.partitions | quote }}
            - --replication-factor
            - "1"

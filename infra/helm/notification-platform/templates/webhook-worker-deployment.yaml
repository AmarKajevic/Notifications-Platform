apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-worker
  labels:
    {{- include "notification-platform.labels" . | nindent 4 }}
    app: webhook-worker
spec:
  replicas: {{ .Values.webhookWorker.replicas }}
  selector:
    matchLabels:
      app: webhook-worker

  template:
    metadata:
      labels:
        {{- include "notification-platform.selectorLabels" . | nindent 8 }}
        app: webhook-worker

    spec:
      containers:
        - name: webhook-worker
          image: "{{ .Values.images.webhookWorker.repository }}:{{ .Values.images.webhookWorker.tag }}"
          imagePullPolicy: {{ .Values.images.webhookWorker.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.webhookWorker.port }}

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: DATABASE_URL

            - name: HEALTH_PORT
              value: "{{ .Values.webhookWorker.port }}"

          envFrom:
            - configMapRef:
                name: {{ include "notification-platform.fullname" . }}-config

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            {{- toYaml .Values.webhookWorker.resources | nindent 12 }}
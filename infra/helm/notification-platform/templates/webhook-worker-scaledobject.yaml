apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: webhook-worker
  labels:
    {{- include "notification-platform.labels" . | nindent 4 }}

spec:
  scaleTargetRef:
    name: webhook-worker

  pollingInterval: 10

  cooldownPeriod: 60

  minReplicaCount: 1

  maxReplicaCount: 6

  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.config.kedaKafkaBrokers | quote }}
        # Same NestJS ServerKafka "-server" postfix as email-worker's
        # ScaledObject — see the comment there for the full explanation.
        consumerGroup: webhook-worker-group-server
        topic: notification.requested
        lagThreshold: "10"
        activationLagThreshold: "1"
        offsetResetPolicy: latest
        allowIdleConsumers: "false"

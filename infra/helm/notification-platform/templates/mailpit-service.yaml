apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    {{- include "notification-platform.labels" . | nindent 4 }}
spec:
  selector:
    app: mailpit
  ports:
    - name: smtp
      port: {{ .Values.mailpit.smtpPort }}
      targetPort: {{ .Values.mailpit.smtpPort }}
    - name: http
      port: {{ .Values.mailpit.httpPort }}
      targetPort: {{ .Values.mailpit.httpPort }}
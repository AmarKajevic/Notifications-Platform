apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels:
    {{- include "notification-platform.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: broker
      port: {{ .Values.kafka.service.clientPort }}
      targetPort: {{ .Values.kafka.service.clientPort }}
    - name: controller
      port: {{ .Values.kafka.service.controllerPort }}
      targetPort: {{ .Values.kafka.service.controllerPort }}
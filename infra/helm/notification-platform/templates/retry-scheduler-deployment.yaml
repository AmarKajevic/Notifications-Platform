apiVersion: apps/v1
kind: Deployment
metadata:
  name: retry-scheduler
  labels:
    {{- include "notification-platform.labels" . | nindent 4 }}
    app: retry-scheduler
spec:
  replicas: {{ .Values.retryScheduler.replicas }}
  selector:
    matchLabels:
      app: retry-scheduler

  template:
    metadata:
      labels:
        {{- include "notification-platform.selectorLabels" . | nindent 8 }}
        app: retry-scheduler

    spec:
      containers:
        - name: retry-scheduler
          image: "{{ .Values.images.retryScheduler.repository }}:{{ .Values.images.retryScheduler.tag }}"
          imagePullPolicy: {{ .Values.images.retryScheduler.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.retryScheduler.port }}

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: DATABASE_URL

            - name: HEALTH_PORT
              value: "{{ .Values.retryScheduler.port }}"

          envFrom:
            - configMapRef:
                name: {{ include "notification-platform.fullname" . }}-config

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            {{- toYaml .Values.retryScheduler.resources | nindent 12 }}
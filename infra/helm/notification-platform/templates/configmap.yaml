apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notification-platform.fullname" . }}-config
  labels:
    {{- include "notification-platform.labels" . | nindent 4 }}
data:
  KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  SMTP_HOST: {{ .Values.config.smtp.host | quote }}
  SMTP_PORT: {{ .Values.config.smtp.port | quote }}
  SMTP_FROM: {{ .Values.config.smtp.from | quote }}
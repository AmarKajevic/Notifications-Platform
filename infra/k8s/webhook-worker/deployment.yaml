apiVersion: apps/v1
kind: Deployment

metadata:
  name: webhook-worker
  namespace: notification-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: webhook-worker

  template:
    metadata:
      labels:
        app: webhook-worker

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: webhook-worker

          image: notification-webhook-worker:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3002

          envFrom:
            - configMapRef:
                name: notification-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: DATABASE_URL

            - name: WORKER_PORT
              value: "3002"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
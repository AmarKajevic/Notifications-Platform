apiVersion: apps/v1
kind: Deployment

metadata:
  name: retry-scheduler
  namespace: notification-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app: retry-scheduler

  template:
    metadata:
      labels:
        app: retry-scheduler

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: retry-scheduler

          image: notification-retry-scheduler:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3003

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notification-secrets
                  key: DATABASE_URL

            - name: HEALTH_PORT
              value: '3003'

          resources:
            requests:
              cpu: '50m'
              memory: '64Mi'

            limits:
              cpu: '250m'
              memory: '256Mi'

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
